name: Build WP8.1 App

on:
  workflow_dispatch: # Позволит запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: windows-2022 # Старая Windows, где есть нужные компоненты

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore || echo "No NuGet packages to restore"

    - name: Build App
      run: msbuild /p:Configuration=Release /p:Platform="ARM"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WP81-Built-App
        path: |
          **/*.xap
          **/*.appx
