name: Build WP8.1 App

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: windows-2022 # Актуальный сервер GitHub

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: nuget restore || echo "No NuGet packages to restore"

    - name: Build App with VS Build
      run: |
        msbuild /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WP81-Built-App
        path: |
          **/*.xap
          **/*.appx
