name: Build App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download .NET 4.5 Targeting Pack via NuGet Tool
      run: |
        nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -OutputDirectory target_pack
        
    - name: Download Windows Phone Assemblies via NuGet Tool
      run: |
        # Скачиваем архивные мобильные библиотеки Windows Phone Silverlight
        nuget install MSBuild.WindowsPhone.v8.0 -Version 1.0.1 -OutputDirectory wp_pack

    - name: Inject Assemblies to MSBuild System
      shell: powershell
      run: |
        $targetDir = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.5"
        if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Force -Path $targetDir }
        
        # 1. Копируем базовый пакет .NET 4.5
        Copy-Item -Path "target_pack\Microsoft.NETFramework.ReferenceAssemblies.net45.1.0.3\build\.NETFramework\v4.5\*" -Destination $targetDir -Recurse -Force
        
        # 2. Извлекаем и подкладываем недостающие библиотеки Microsoft.Phone и Microsoft.Phone.Interop
        $wpLibPath = "wp_pack\MSBuild.WindowsPhone.v8.0.1.0.1\tools\Reference Assemblies\Microsoft\Framework\WindowsPhone\v8.0"
        if (Test-Path $wpLibPath) {
            Copy-Item -Path "$wpLibPath\Microsoft.Phone.dll" -Destination $targetDir -Force
            Copy-Item -Path "$wpLibPath\Microsoft.Phone.Interop.dll" -Destination $targetDir -Force
            echo "Successfully injected Windows Phone assemblies!"
        } else {
            echo "Warning: WP library path not found"
        }

    - name: Restore NuGet Packages
      run: nuget restore SeaGateQVM.csproj || echo "No NuGet packages to restore"

    - name: Build App with VS Build
      run: |
        msbuild SeaGateQVM.csproj /p:Configuration=Release /p:Platform="AnyCPU"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Built-App
        path: |
          **/bin/Release/
          **/*.exe
          **/*.xap
          **/*.appx
