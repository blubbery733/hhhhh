name: Build App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install .NET Framework 4.5 Targeting Pack
      run: |
        choco install netfx-4.5-devpack -y

    - name: Restore NuGet Packages
      run: nuget restore SeaGateQVM.csproj || echo "No NuGet packages to restore"

    - name: Build App with VS Build
      run: |
        msbuild SeaGateQVM.csproj /p:Configuration=Release /p:Platform="AnyCPU"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Built-App
        path: |
          **/bin/Release/
          **/*.exe
          **/*.xap
          **/*.appx
